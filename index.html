<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estado de Pubilete</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f1f3f4;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:white;
      padding:40px;
      border-radius:18px;
      box-shadow:0 4px 20px rgba(0,0,0,0.15);
      text-align:center;
      width:320px;
    }

    h1{
      color:#202124;
      margin-bottom:10px;
    }

    p{
      color:#5f6368;
      margin-bottom:25px;
    }

    button{
      background:#1a73e8;
      color:white;
      border:none;
      padding:12px 22px;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      transition:0.2s;
    }

    button:hover{
      background:#1558b0;
    }

    #resultado{
      display:none;
      margin-top:35px;
      font-size:55px;
      font-weight:bold;
      color:#202124;
      word-break:break-word;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Estado de cuenta</h1>
    <p>Consulta el estado actual de tu cuenta.</p>

    <button onclick="mostrarPubilete()">
      Revisar estado
    </button>

    <div id="resultado">
      PENDEJO, SOY EL BRUNO
    </div>
  </div>

  <script>
    function mostrarPubilete(){
      document.getElementById("resultado").style.display = "block";
    }
  </script>

</body>
</html>
